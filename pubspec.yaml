name: mimi_store
description: Responsive fashion ecommerce app for Mimi Store.
publish_to: none
version: 1.2.0+16

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^10.0.0
  geolocator: ^14.0.2
  http: ^1.5.0
  http_parser: ^4.1.2
  image_picker: ^1.1.2
  intl_phone_field: ^3.2.0
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/mimi_hero.png

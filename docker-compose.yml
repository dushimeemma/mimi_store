services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mimi_store
      POSTGRES_USER: mimi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - mimi_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mimi -d mimi_store"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://mimi:${POSTGRES_PASSWORD}@db:5432/mimi_store
      DATABASE_SSL: "false"
    command: ["sh", "-c", "node dist/migrate.js && node dist/seed.js"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://mimi:${POSTGRES_PASSWORD}@db:5432/mimi_store
      DATABASE_SSL: "false"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mimi_postgres:
